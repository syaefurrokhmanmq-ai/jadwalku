name: Kirim Notifikasi Jadwal

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  kirim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang google-auth
        run: pip install -r requirements.txt

      - name: Tulis kunci service account saking Secret
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Kirim notifikasi
        run: python send_notifications.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS: service-account.json

      - name: Busak kunci service account
        if: always()
        run: rm -f service-account.json
